<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatysGuitar</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8a030" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MatysGuitar" />
  <link rel="apple-touch-icon" href="fotky/logo.png" />

      <button class="arrow arrow-left">

      <button class="arrow arrow-right">
        <img src="fotky/sipkaVpravo.png" alt="" />

  <section id="page-content" class="page-section"></section>
